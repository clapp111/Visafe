# 로컬 개발용 인프라: docker compose up -d
# 같은 폴더의 .env를 자동으로 읽는다. PC에 PostgreSQL이 이미 5432를 쓰면 .env에 POSTGRES_PORT=5433 등을 넣는다.
services:
  postgres:
    image: postgres:17-alpine
    container_name: visafe-postgres
    environment:
      POSTGRES_DB: visafe
      POSTGRES_USER: visafe
      POSTGRES_PASSWORD: visafe
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visafe -d visafe"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
