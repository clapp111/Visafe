# H2 인메모리 DB 테스트. 마이그레이션 SQL은 PostgreSQL 전용 문법(생성 컬럼, 정규식 CHECK, plpgsql 트리거)이라
# H2에서는 Flyway를 끄고 엔티티로 테이블을 만든다. 스키마까지 확인하는 테스트는 실제 PostgreSQL로 실행한다.
spring:
  datasource:
    url: jdbc:h2:mem:visafe;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
