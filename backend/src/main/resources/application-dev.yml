# 개발 서버. 접속 정보는 서버 환경 변수로만 받는다. (기본값 없음: 빠지면 시작 시 실패)
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5

  # 스키마 + 데모 계정 시드 (db/seed는 local·dev에서만, prod는 application.yml의 db/migration만)
  flyway:
    locations: classpath:db/migration,classpath:db/seed

logging:
  level:
    com.visafe: info

visafe:
  storage:
    key-prefix: dev
