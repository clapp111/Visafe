# 운영 서버. 접속 정보는 서버 환경 변수로만 받는다. (기본값 없음: 빠지면 시작 시 실패)
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.visafe: info
