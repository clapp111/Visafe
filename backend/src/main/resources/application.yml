# 모든 환경 공통 설정. 환경별로 다른 값만 application-{local,dev,prod}.yml에 둔다.
# 프로필 지정: SPRING_PROFILES_ACTIVE=dev (지정하지 않으면 local)
spring:
  application:
    name: visafe-backend
  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver

  # 스키마는 Flyway(db/migration/V{n}__설명.sql)가 만들고 바꾼다. 이미 적용된 마이그레이션 파일은 고치지 않고 새 버전을 추가한다.
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      # Hibernate는 테이블을 만들지 않고, 엔티티가 Flyway로 만든 스키마와 맞는지만 검사한다.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC

  data:
    web:
      pageable:
        max-page-size: 100

  # 계약서 원본 업로드 (PDF·JPG·PNG 1개, 최대 10MB). 넘으면 413 FILE_TOO_LARGE.
  # 요청 전체는 파일에 JSON 파트(data)가 붙으므로 조금 더 크게 둔다.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    # 크기 제한을 넘은 요청에 413을 보낸 뒤, 남은 본문을 이 크기까지 읽고 버린다. (기본 2MB)
    # 기본값이면 조금만 큰 파일도 응답 전에 연결이 끊겨 브라우저에 네트워크 오류로 보인다.
    max-swallow-size: 20MB
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# JWT. 비밀 키는 환경 변수로만 받는다. (32바이트 이상, 서버마다 다르게)
jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 3h
  refresh-token-validity: 14d

# 리프레시 토큰 쿠키를 주고받으므로 프론트 주소만 허용한다. 쉼표로 여러 개 지정.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

visafe:
  # 계약서 원본 저장소 (S3). 버킷 하나를 환경별 key-prefix(local·dev·prod)로 나눠 쓴다.
  # 서버에서는 접근 키를 비워 두고 IAM Role(기본 자격 증명 체인)로 접근한다.
  storage:
    bucket: ${S3_BUCKET}
    region: ${S3_REGION:ap-northeast-2}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    presigned-url-ttl: 5m
    object-lock:
      # 켜면 올리는 파일마다 Governance 모드 보존 기간을 붙인다. 버킷에 객체 잠금이 켜져 있어야 한다.
      enabled: ${S3_OBJECT_LOCK_ENABLED:false}
      retention: 3y
