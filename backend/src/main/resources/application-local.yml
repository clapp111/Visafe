# 로컬 개발. DB는 compose.yaml의 PostgreSQL(docker compose up -d)을 기본값으로 쓴다.
# 값을 바꾸거나 키를 넣을 때는 backend/.env 파일을 만든다. (.env.example 참고, 커밋 금지)
spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/visafe}
    username: ${DB_USERNAME:visafe}
    password: ${DB_PASSWORD:visafe}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.visafe: debug

# 로컬 전용 기본값. dev/prod에서는 반드시 JWT_SECRET 환경 변수로 다른 값을 넣는다.
jwt:
  secret: ${JWT_SECRET:local-only-jwt-secret-do-not-use-in-dev-or-prod}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
